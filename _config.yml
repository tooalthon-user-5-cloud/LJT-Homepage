# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &name "Junteng Liu"
description              : &description "Junteng Liu's academic portfolio"   # Update this with a general description of your site, this is the default if not overridden by a page
url                      : https://tooalthon-user-5-cloud.github.io/LJT-Homepage # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io/", if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "/LJT-Homepage/" # the subpath of your site, e.g. "/blog"
repository               : "tooalthon-user-5-cloud/LJT-Homepage"

# Site Author - The following control what appear as part of the author content on the side bar.
